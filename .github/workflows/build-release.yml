name: Build and Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    build-linux:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - goarch: amd64
                      filename: amd64
                      container: muslcc/x86_64:x86_64-linux-musl
                      host: ""
                    - goarch: arm64
                      filename: arm64
                      container: muslcc/x86_64:aarch64-linux-musl
                      host: aarch64-linux-musl
                    - goarch: arm
                      filename: arm32
                      container: muslcc/x86_64:arm-linux-musleabihf
                      host: arm-linux-musleabihf
                    - goarch: mips
                      filename: mips
                      container: muslcc/x86_64:mips-linux-muslsf
                      host: mips-linux-muslsf
                    - goarch: mipsle
                      filename: mipsle
                      container: muslcc/x86_64:mipsel-linux-muslsf
                      host: mipsel-linux-muslsf
                    - goarch: mips64
                      filename: mips64
                      container: muslcc/x86_64:mips64-linux-musl
                      host: mips64-linux-musl
                    - goarch: mips64le
                      filename: mips64le
                      container: muslcc/x86_64:mips64el-linux-musl
                      host: mips64el-linux-musl

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Get tag or commit
              id: ref_id
              shell: bash
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    REF_ID="${GITHUB_REF#refs/tags/}"
                    echo "Triggered by tag: $REF_ID"
                  else
                    REF_ID=$(git rev-parse --short HEAD)
                    echo "No tag detected. Using commit hash: $REF_ID"
                  fi
                  echo "ref=$REF_ID" >> $GITHUB_OUTPUT

            - name: Build in musl container
              run: |
                  mkdir -p dist
                  docker run --rm -i \
                    -v "$PWD:/src" -w /src \
                    -e GOARCH=${{ matrix.goarch }} \
                    -e FILENAME=${{ matrix.filename }} \
                    -e HOST_TRIPLE='${{ matrix.host }}' \
                    -e VERSION='${{ steps.ref_id.outputs.ref }}' \
                    ${{ matrix.container }} \
                    sh -eus <<'EOF'
                  apk update
                  apk add --no-cache git bash tar gzip wget flex bison linux-headers make

                  GO_VERSION=1.26.4
                  wget -q https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz
                  tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
                  export PATH=$PATH:/usr/local/go/bin
                  git config --global --add safe.directory /src

                  LIBPCAP_VERSION=1.10.6
                  wget -q https://www.tcpdump.org/release/libpcap-${LIBPCAP_VERSION}.tar.gz
                  tar -xzf libpcap-${LIBPCAP_VERSION}.tar.gz
                  cd libpcap-${LIBPCAP_VERSION}
                  [ -n "$HOST_TRIPLE" ] && HOST_FLAG="--host=$HOST_TRIPLE" || HOST_FLAG=""
                  ./configure ${HOST_FLAG} --prefix=/opt/libpcap \
                    --disable-shared --disable-dbus --disable-bluetooth \
                    --disable-usb --with-pcap=linux
                  make -j$(nproc)
                  make install
                  cd ..

                  export CGO_ENABLED=1 GOOS=linux CC=gcc
                  export GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo unknown)
                  export GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo unknown)
                  export BUILD_TIME=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
                  export PKG_CONFIG_PATH=/opt/libpcap/lib/pkgconfig
                  export CGO_CFLAGS="-I/opt/libpcap/include"
                  export CGO_LDFLAGS="-L/opt/libpcap/lib -lpcap"

                  [ "$GOARCH" = arm ] && export GOARM=7
                  case "$GOARCH" in mips|mipsle) export GOMIPS=softfloat;; esac
                  case "$GOARCH" in mips64|mips64le) export GOMIPS64=hardfloat;; esac
                  case "$GOARCH" in mips|mipsle|mips64|mips64le) GCFLAGS="";; *) GCFLAGS="all=-l=4";; esac

                  go build -v -a -trimpath \
                    -gcflags "${GCFLAGS}" \
                    -ldflags "-s -w -buildid= -linkmode external -extldflags '-static' \
                    -X 'paqet/cmd/version.Version=${VERSION}' \
                    -X 'paqet/cmd/version.GitCommit=${GIT_COMMIT}' \
                    -X 'paqet/cmd/version.GitTag=${GIT_TAG}' \
                    -X 'paqet/cmd/version.BuildTime=${BUILD_TIME}'" \
                    -o paqet_linux_${FILENAME} ./cmd/main.go

                  chmod +x paqet_linux_${FILENAME}
                  tar -czvf dist/paqet-linux-${FILENAME}-${VERSION}.tar.gz \
                    paqet_linux_${FILENAME} README.md \
                    example/client.yaml.example example/server.yaml.example
                  EOF

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: paqet-linux-${{ matrix.filename }}
                  path: dist/paqet-linux-${{ matrix.filename }}-${{ steps.ref_id.outputs.ref }}.tar.gz
                  retention-days: 7

    build-windows:
        runs-on: windows-latest
        strategy:
            matrix:
                goarch: [amd64]
        steps:
            - name: Setup Build Environment
              run: |
                  # Install Npcap for libpcap support on Windows
                  choco install npcap -y
                  # Install MinGW for CGO support
                  choco install mingw -y

            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.26"

            - name: Get tag or commit
              id: ref_id
              shell: bash
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    REF_ID="${GITHUB_REF#refs/tags/}"
                    echo "Triggered by tag: $REF_ID"
                  else
                    REF_ID=$(git rev-parse --short HEAD)
                    echo "No tag detected. Using commit hash: $REF_ID"
                  fi
                  echo "ref=$REF_ID" >> $GITHUB_OUTPUT

            - name: Build
              shell: bash
              run: |
                  mkdir -p dist
                  export CGO_ENABLED=1
                  export GOOS=windows
                  export GOARCH=${{ matrix.goarch }}
                  export VERSION=${{ steps.ref_id.outputs.ref }}
                  export GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
                  export GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "unknown")
                  export BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

                  go build -v -a -trimpath \
                    -gcflags "all=-l=4" \
                    -ldflags "-s -w -buildid= \
                    -X 'paqet/cmd/version.Version=${VERSION}' \
                    -X 'paqet/cmd/version.GitCommit=${GIT_COMMIT}' \
                    -X 'paqet/cmd/version.GitTag=${GIT_TAG}' \
                    -X 'paqet/cmd/version.BuildTime=${BUILD_TIME}'" \
                    -o paqet_windows_${{ matrix.goarch }}.exe ./cmd/main.go

                  7z a -tzip dist/paqet-windows-${{ matrix.goarch }}-${{ steps.ref_id.outputs.ref }}.zip \
                    paqet_windows_${{ matrix.goarch }}.exe \
                    README.md \
                    example/client.yaml.example \
                    example/server.yaml.example

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: paqet-windows-${{ matrix.goarch }}
                  path: dist/paqet-windows-${{ matrix.goarch }}-${{ steps.ref_id.outputs.ref }}.zip
                  retention-days: 7

    build-darwin:
        runs-on: macos-latest
        strategy:
            matrix:
                goarch: [amd64, arm64]
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.26"

            - name: Get tag or commit
              id: ref_id
              run: |
                  if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                    REF_ID="${GITHUB_REF#refs/tags/}"
                    echo "Triggered by tag: $REF_ID"
                  else
                    REF_ID=$(git rev-parse --short HEAD)
                    echo "No tag detected. Using commit hash: $REF_ID"
                  fi
                  echo "ref=$REF_ID" >> $GITHUB_OUTPUT

            - name: Build
              run: |
                  mkdir -p dist
                  export CGO_ENABLED=1
                  export GOOS=darwin
                  export GOARCH=${{ matrix.goarch }}
                  export VERSION=${{ steps.ref_id.outputs.ref }}
                  export GIT_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
                  export GIT_TAG=$(git describe --tags --exact-match 2>/dev/null || echo "unknown")
                  export BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

                  go build -v -a -trimpath \
                    -gcflags "all=-l=4" \
                    -ldflags "-s -w -buildid= \
                    -X 'paqet/cmd/version.Version=${VERSION}' \
                    -X 'paqet/cmd/version.GitCommit=${GIT_COMMIT}' \
                    -X 'paqet/cmd/version.GitTag=${GIT_TAG}' \
                    -X 'paqet/cmd/version.BuildTime=${BUILD_TIME}'" \
                    -o paqet_darwin_${{ matrix.goarch }} ./cmd/main.go

                  chmod +x paqet_darwin_${{ matrix.goarch }}
                  tar -czvf dist/paqet-darwin-${{ matrix.goarch }}-${{ steps.ref_id.outputs.ref }}.tar.gz \
                    paqet_darwin_${{ matrix.goarch }} \
                    README.md \
                    example/client.yaml.example \
                    example/server.yaml.example

            - name: Upload Artifact
              uses: actions/upload-artifact@v7
              with:
                  name: paqet-darwin-${{ matrix.goarch }}
                  path: dist/paqet-darwin-${{ matrix.goarch }}-${{ steps.ref_id.outputs.ref }}.tar.gz
                  retention-days: 7

    release:
        runs-on: ubuntu-latest
        needs: [build-linux, build-darwin, build-windows]
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            - name: Download all build artifacts
              uses: actions/download-artifact@v8
              with:
                  path: ./dist
                  pattern: paqet-*
                  merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
